<style>
:root{color-scheme:light dark;--bg:#fcfcfb;--fg:#0b0b0b;--line:#d9d7d0;--card:#f1f0ec}

input{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);box-sizing:border-box}
button{margin-top:10px;width:100%;font:inherit;padding:10px;border:1px solid var(--fg);border-radius:8px;background:var(--bg);color:var(--fg);cursor:pointer}
.err{color:#c0392b;font-size:13px;min-height:18px;margin-top:8px}
</style></head><body>
