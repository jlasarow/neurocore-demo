const u8=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
function mount(html){
  const doc=new DOMParser().parseFromString(html,'text/html');
  document.title=doc.title||document.title;
  document.documentElement.setAttribute('lang',doc.documentElement.getAttribute('lang')||'en');
  document.head.innerHTML='';
  for(const n of Array.from(doc.head.children)){ if(n.tagName==='SCRIPT') continue; document.head.appendChild(document.importNode(n,true)); }
  const body=document.body; body.innerHTML=''; body.removeAttribute('style'); body.className='';
  const scripts=[];
  for(const n of Array.from(doc.body.childNodes)){ if(n.nodeType===1 && n.tagName==='SCRIPT') scripts.push(n); else body.appendChild(document.importNode(n,true)); }
  for(const n of Array.from(doc.head.querySelectorAll('script'))) scripts.unshift(n);
  for(const sc of scripts){ const el=document.createElement('script'); if(sc.src) el.src=sc.src; else el.textContent=sc.textContent; document.body.appendChild(el); }
  window.scrollTo(0,0);
}
document.getElementById('f').onsubmit=async e=>{e.preventDefault(); const err=document.getElementById('err'); err.textContent='Opening...';
 try{ const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(document.getElementById('pw').value),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u8(SALT),iterations:300000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(NONCE)},key,u8(CT));
  mount(new TextDecoder().decode(pt));
 }catch(x){ err.textContent='That password did not open it.'; } };
