<style>
:root{color-scheme:light dark;--bg:#f5f6f8;--fg:#0d1726;--line:#dfe3ea;--card:#ffffff;--brand:#0b5d6b}
@media(prefers-color-scheme:dark){:root{--bg:#0c1016;--fg:#edf1f5;--line:#27303c;--card:#141a22;--brand:#57c2cf}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font:16px/1.55 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;padding:20px}
.card{max-width:440px;width:100%;border:1px solid var(--line);border-radius:18px;padding:32px;background:var(--card);box-shadow:0 10px 40px rgba(13,23,38,.08)}
.b{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;margin-bottom:22px}
.b svg{width:28px;height:28px;color:var(--brand)}
h1{font-size:24px;line-height:1.2;letter-spacing:-.02em;margin:0 0 10px}
p{margin:0 0 20px;font-size:15px}
label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
input{width:100%;font:inherit;padding:12px 14px;border:1px solid var(--line);border-radius:11px;background:var(--bg);color:var(--fg)}
input:focus{outline:2px solid var(--brand);outline-offset:1px}
button{margin-top:12px;width:100%;font:inherit;font-weight:600;padding:12px;border:0;border-radius:11px;background:var(--fg);color:var(--bg);cursor:pointer}
.err{font-size:14px;min-height:22px;margin-top:10px}
.f{font-size:13px;margin:14px 0 0}
</style></head><body>

const u8=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));

function mount(html){
  const doc=new DOMParser().parseFromString(html,'text/html');
  document.title=doc.title||document.title;
  document.documentElement.setAttribute('lang',doc.documentElement.getAttribute('lang')||'en');
  document.head.innerHTML='';
  for(const n of Array.from(doc.head.children)){ if(n.tagName==='SCRIPT') continue; document.head.appendChild(document.importNode(n,true)); }
  const body=document.body; body.innerHTML=''; body.removeAttribute('style'); body.className='';
  const scripts=[];
  for(const n of Array.from(doc.body.childNodes)){ if(n.nodeType===1 && n.tagName==='SCRIPT') scripts.push(n); else body.appendChild(document.importNode(n,true)); }
  for(const n of Array.from(doc.head.querySelectorAll('script'))) scripts.unshift(n);
  for(const sc of scripts){ const el=document.createElement('script'); if(sc.src) el.src=sc.src; else el.textContent=sc.textContent; document.body.appendChild(el); }
  window.scrollTo(0,0);
}
document.getElementById('f').onsubmit=async e=>{e.preventDefault(); const err=document.getElementById('err'); err.textContent='Opening...';
 try{ const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(document.getElementById('pw').value),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u8(SALT),iterations:300000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(NONCE)},key,u8(CT));
  mount(new TextDecoder().decode(pt));
 }catch(x){ err.textContent='That password did not open it.'; } };
